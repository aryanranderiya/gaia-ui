# Single-package repo: the root is the only "workspace package". Some pnpm
# versions (e.g. 10.11, used by Cloudflare Workers Builds) hard-error if this
# file exists without a packages field.
packages:
  - "."

allowBuilds:
  '@heroui/shared-utils': true
  '@tailwindcss/oxide': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  '@types/react': 19.1.2
  '@types/react-dom': 19.1.2
